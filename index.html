<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flag Duty</title>
<meta name="theme-color" content="#1E9187">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --ink: #26312E;
    --ink-soft: #5B6B67;
    --line: #E1DED4;
    --teal: #1E9187;
    --teal-deep: #14685F;
    --teal-wash: #E3F3F1;
    --amber: #D98E2C;
    --amber-wash: #FBEDD9;
    --clay: #C1543A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 64px;
  }
  .page { width: 100%; max-width: 460px; }

  header { padding: 4px 4px 22px; }
  header .crumb { font-size: 13px; color: var(--teal-deep); font-weight: 600; margin: 0 0 4px; }
  header h1 {
    font-family: 'Fredoka', 'Inter', sans-serif;
    font-weight: 600; font-size: 30px; margin: 0; color: var(--ink); line-height: 1.15;
  }
  header p { margin: 8px 0 0; color: var(--ink-soft); font-size: 14.5px; line-height: 1.5; max-width: 36ch; }

  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .tab-btn {
    flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
    border-radius: 11px; padding: 10px 0; font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer;
  }
  .tab-btn[data-active="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }
  .tab-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .status { font-size: 12.5px; color: var(--ink-soft); margin: 0 4px 14px; min-height: 16px; }
  .status.err { color: var(--clay); }

  .round-strip {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 18px; display: flex; align-items: center; gap: 12px;
  }
  .round-strip .count { font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: var(--teal-deep); white-space: nowrap; }
  .round-strip .track { flex: 1; height: 8px; border-radius: 5px; background: var(--teal-wash); overflow: hidden; }
  .round-strip .track-fill { height: 100%; background: var(--teal); border-radius: 5px; transition: width .35s ease; }

  .banner {
    background: var(--teal); color: #fff; border-radius: 14px; padding: 13px 16px;
    font-size: 14.5px; font-weight: 500; margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
    animation: pop .4s ease;
  }
  @keyframes pop { 0% { transform: scale(.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  .add-row { display: flex; gap: 8px; margin-bottom: 22px; }
  .add-row input {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 12px; padding: 12px 14px; font-size: 15px; font-family: inherit;
  }
  .add-row input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  .add-row button {
    background: var(--teal); color: #fff; border: none; border-radius: 12px; padding: 0 18px;
    font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .add-row button:disabled { opacity: .5; }
  .add-row button:active { transform: translateY(1px); }
  .add-row button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }

  .empty {
    border: 1.5px dashed var(--line); border-radius: 14px; padding: 28px 20px;
    text-align: center; color: var(--ink-soft); font-size: 14.5px; line-height: 1.6;
  }

  .row {
    background: var(--surface); border: 1px solid var(--line); border-radius: 13px;
    padding: 11px 10px 11px 14px; display: flex; align-items: center; gap: 10px;
    transition: border-color .2s, background .2s;
  }
  .row[data-done="true"] { border-color: var(--teal); background: var(--teal-wash); }

  .row .tick {
    width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none;
    padding: 0; color: transparent; font-size: 16px;
  }
  .row[data-done="true"] .tick { background: var(--teal); border-color: var(--teal); color: #fff; }
  .row .tick:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .row .name-block { flex: 1; min-width: 0; }
  .row .name {
    font-size: 15.5px; font-weight: 500; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .tag {
    display: inline-block; margin-top: 2px; font-size: 11.5px; font-weight: 600; color: var(--amber);
    background: var(--amber-wash); border-radius: 6px; padding: 1px 6px;
  }
  .row .count-tag {
    display: inline-block; margin-top: 2px; margin-right: 6px; font-size: 11.5px; font-weight: 500; color: var(--ink-soft);
  }

  .row .excuse-btn {
    background: none; border: none; color: var(--ink-soft); font-size: 12.5px; font-weight: 500;
    text-decoration: underline; text-decoration-color: var(--line); cursor: pointer; padding: 4px 2px;
    font-family: inherit; flex: none; white-space: nowrap;
  }
  .row[data-done="true"] .excuse-btn { visibility: hidden; }
  .row .excuse-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .row .remove-btn { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 18px; line-height: 1; padding: 4px 6px; flex: none; }
  .row .remove-btn:hover { color: var(--clay); }
  .row .remove-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .footer-actions { display: flex; justify-content: center; padding-top: 4px; }
  .reset-btn {
    background: none; border: 1px solid var(--line); color: var(--ink-soft); border-radius: 11px;
    padding: 10px 16px; font-size: 13.5px; font-weight: 500; font-family: inherit; cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--clay); color: var(--clay); }
  .reset-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .hint { text-align: center; color: var(--ink-soft); font-size: 12.5px; margin-top: 10px; line-height: 1.5; }

  [hidden] { display: none !important; }
  .login { width: 100%; max-width: 460px; padding-top: 48px; }
  .login h1 { font-family: 'Fredoka', 'Inter', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 6px; }
  .login p { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 22px; }
  .login form { display: flex; flex-direction: column; gap: 10px; }
  .login input {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 12px; padding: 13px 14px; font-size: 16px; font-family: inherit;
  }
  .login input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  .login button {
    background: var(--teal); color: #fff; border: none; border-radius: 12px; padding: 13px;
    font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .login button:disabled { opacity: .5; }
  .link-btn {
    background: none; border: none; color: var(--ink-soft); font-size: 12.5px; font-family: inherit;
    text-decoration: underline; text-decoration-color: var(--line); cursor: pointer; padding: 4px;
  }
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <h1>Flag Duty</h1>
  <p>Sign in to continue.</p>
  <form id="login-form">
    <input type="email" id="login-email" placeholder="Email" autocomplete="username" required>
    <input type="password" id="login-pw" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" id="login-btn">Sign in</button>
  </form>
  <p class="status err" id="login-err" style="margin:12px 0 0"></p>
</div>

<div class="page" id="app" hidden>
  <header>
    <p class="crumb" id="crumb">Ellesmere Beavers</p>
    <h1>Flag Duty</h1>
    <p id="subtitle">Tap a Beaver when they've raised and lowered the flag. Once everyone's had a turn, the round resets on its own.</p>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab-btn" data-section="beavers" type="button">Beavers</button>
    <button class="tab-btn" data-section="cubs" type="button">Cubs</button>
    <button class="tab-btn" data-section="scouts" type="button">Scouts</button>
  </div>

  <p class="status" id="status"></p>
  <div id="banner-slot"></div>

  <div class="round-strip">
    <span class="count" id="round-count">0 / 0</span>
    <div class="track"><div class="track-fill" id="round-fill" style="width:0%"></div></div>
  </div>

  <form class="add-row" id="add-form">
    <input type="text" id="add-input" placeholder="Add a Beaver's name" autocomplete="off">
    <button type="submit" id="add-btn">Add</button>
  </form>

  <div class="list" id="list"></div>

  <div class="footer-actions">
    <button class="reset-btn" id="reset-btn" type="button">Reset the round</button>
  </div>
  <p class="hint">Sat out this round? Use <em>excuse</em> on their row so the round can still complete.</p>
  <p class="hint"><button class="link-btn" id="signout-btn" type="button">Sign out on this device</button></p>
</div>

<script>
(function () {
  var FIREBASE_URL = "https://beaver-flag-duty-default-rtdb.europe-west1.firebasedatabase.app";
  var SECTIONS = {
    beavers: { singular: 'Beaver', plural: 'Beavers', crumb: 'Ellesmere Beavers', groupNoun: 'Lodge' },
    cubs:    { singular: 'Cub',    plural: 'Cubs',    crumb: 'Ellesmere Cubs',    groupNoun: 'Six' },
    scouts:  { singular: 'Scout',  plural: 'Scouts',  crumb: 'Ellesmere Scouts',  groupNoun: 'Patrol' }
  };
  var currentSection = (localStorage.getItem('flagduty-section') in SECTIONS)
    ? localStorage.getItem('flagduty-section') : 'beavers';

  var people = {};           // id -> { name, done, excused, count }
  var lastKnownJson = null;  // for change detection on poll
  var pollTimer = null;
  var suppressPollRender = false;

  var listEl = document.getElementById('list');
  var statusEl = document.getElementById('status');
  var countEl = document.getElementById('round-count');
  var fillEl = document.getElementById('round-fill');
  var addForm = document.getElementById('add-form');
  var addInput = document.getElementById('add-input');
  var addBtn = document.getElementById('add-btn');
  var resetBtn = document.getElementById('reset-btn');
  var bannerSlot = document.getElementById('banner-slot');
  var crumbEl = document.getElementById('crumb');
  var subtitleEl = document.getElementById('subtitle');
  var tabsEl = document.getElementById('tabs');

  function sec() { return SECTIONS[currentSection]; }
  function peoplePath() { return FIREBASE_URL + '/' + currentSection + '.json'; }
  function itemPath(id) { return FIREBASE_URL + '/' + currentSection + '/' + id + '.json'; }

  function setStatus(text, isError) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (isError ? ' err' : '');
  }

  function showBanner(text, ms) {
    bannerSlot.innerHTML = '<div class="banner">' + escapeHtml(text) + '</div>';
    if (ms) {
      setTimeout(function () { bannerSlot.innerHTML = ''; }, ms);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function updateCopyForSection() {
    crumbEl.textContent = sec().crumb;
    subtitleEl.textContent = "Tap a " + sec().singular + " when they've raised and lowered the flag. Once everyone's had a turn, the round resets on its own.";
    addInput.placeholder = "Add a " + sec().singular + "'s name";
    Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab-btn'), function (btn) {
      btn.setAttribute('data-active', btn.getAttribute('data-section') === currentSection);
    });
  }

  function render() {
    var ids = Object.keys(people);
    if (ids.length === 0) {
      listEl.innerHTML = '<div class="empty">No ' + sec().plural + ' added yet. Add your ' + sec().groupNoun + ' below to start tracking flag duty.</div>';
    } else {
      listEl.innerHTML = ids.map(function (id) {
        var p = people[id];
        var tag = p.done && p.excused ? '<span class="tag">sat out</span>' : '';
        var count = p.count || 0;
        var countLabel = '<span class="count-tag">' + count + (count === 1 ? ' turn' : ' turns') + '</span>';
        return (
          '<div class="row" data-done="' + !!p.done + '" data-id="' + id + '">' +
            '<button class="tick" data-action="tick" aria-label="Mark ' + escapeHtml(p.name) + (p.done ? ' not done' : ' done') + '">&#10003;</button>' +
            '<div class="name-block"><div class="name">' + escapeHtml(p.name) + '</div>' + countLabel + tag + '</div>' +
            (p.done ? '' : '<button class="excuse-btn" data-action="excuse">Excuse</button>') +
            '<button class="remove-btn" data-action="remove" aria-label="Remove ' + escapeHtml(p.name) + '">&times;</button>' +
          '</div>'
        );
      }).join('');
    }
    var doneCount = ids.filter(function (id) { return people[id].done; }).length;
    countEl.textContent = doneCount + ' / ' + ids.length;
    fillEl.style.width = (ids.length ? (doneCount / ids.length * 100) : 0) + '%';
  }

  // ---- Auth (Firebase email/password via REST, no SDK) ----
  var API_KEY = "AIzaSyCJ0LuR-Y94Ucoav-HUl9m72dqG5_oHiWg";
  var AUTH_STORE = 'flagduty-auth';
  var auth = null; // { idToken, refreshToken, expiresAt }
  var appEl = document.getElementById('app');
  var loginEl = document.getElementById('login');
  var loginErr = document.getElementById('login-err');

  function loadAuth() {
    try { auth = JSON.parse(localStorage.getItem(AUTH_STORE)); } catch (e) { auth = null; }
    if (auth && !auth.refreshToken) auth = null;
  }
  function saveAuth(idToken, refreshToken, expiresInSec) {
    auth = { idToken: idToken, refreshToken: refreshToken, expiresAt: Date.now() + (parseInt(expiresInSec, 10) - 60) * 1000 };
    localStorage.setItem(AUTH_STORE, JSON.stringify(auth));
  }
  function authError(msg) { var e = new Error(msg); e.authFailed = true; return e; }

  function friendlyAuthMessage(d) {
    var m = (d && d.error && d.error.message) || '';
    if (m.indexOf('INVALID_LOGIN_CREDENTIALS') === 0 || m.indexOf('INVALID_PASSWORD') === 0 || m.indexOf('EMAIL_NOT_FOUND') === 0) return 'Wrong email or password.';
    if (m.indexOf('TOO_MANY_ATTEMPTS') === 0) return 'Too many attempts \u2014 wait a few minutes and try again.';
    if (m.indexOf('USER_DISABLED') === 0) return 'This account has been disabled.';
    return 'Couldn\u2019t sign in (' + (m || 'unknown error') + ').';
  }
  function signInRequest(email, pw) {
    return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + API_KEY, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: pw, returnSecureToken: true })
    }).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) throw authError(friendlyAuthMessage(d));
        return d;
      });
    });
  }
  function refreshSession() {
    return fetch('https://securetoken.googleapis.com/v1/token?key=' + API_KEY, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(auth.refreshToken)
    }).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) throw authError('Session expired');
        saveAuth(d.id_token, d.refresh_token, d.expires_in);
      });
    });
  }
  function getToken() {
    if (!auth) return Promise.reject(authError('Signed out'));
    if (Date.now() < auth.expiresAt) return Promise.resolve(auth.idToken);
    return refreshSession().then(function () { return auth.idToken; });
  }
  function authedFetch(url, opts) {
    return getToken().then(function (tok) {
      return fetch(url + (url.indexOf('?') > -1 ? '&' : '?') + 'auth=' + encodeURIComponent(tok), opts);
    }).then(function (r) {
      if (r.status === 401 || r.status === 403) throw authError('Session expired');
      return r;
    }).catch(function (e) {
      if (e.authFailed) signOut('Please sign in again.');
      throw e;
    });
  }

  function showLogin(msg) {
    appEl.hidden = true;
    loginEl.hidden = false;
    loginErr.textContent = msg || '';
  }
  function startApp() {
    loginEl.hidden = true;
    appEl.hidden = false;
    render();
    loadAndRender();
    if (!pollTimer) pollTimer = setInterval(loadAndRender, 4000);
  }
  function signOut(msg) {
    auth = null;
    localStorage.removeItem(AUTH_STORE);
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    people = {};
    lastKnownJson = null;
    showLogin(msg);
  }

  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('login-btn');
    var pwEl = document.getElementById('login-pw');
    btn.disabled = true;
    loginErr.textContent = '';
    signInRequest(document.getElementById('login-email').value.trim(), pwEl.value).then(function (d) {
      saveAuth(d.idToken, d.refreshToken, d.expiresIn);
      pwEl.value = '';
      startApp();
    }).catch(function (err) {
      loginErr.textContent = err.authFailed ? err.message : 'Couldn\u2019t connect \u2014 check your signal and try again.';
    }).finally(function () { btn.disabled = false; });
  });
  document.getElementById('signout-btn').addEventListener('click', function () {
    if (window.confirm('Sign out on this device?')) signOut('');
  });

  // ---- Firebase REST helpers ----
  function fbGet() {
    return authedFetch(peoplePath()).then(function (r) {
      if (!r.ok) throw new Error('Load failed (' + r.status + ')');
      return r.json();
    });
  }
  function fbPost(body) {
    return authedFetch(peoplePath(), { method: 'POST', body: JSON.stringify(body) }).then(function (r) {
      if (!r.ok) throw new Error('Save failed (' + r.status + ')');
      return r.json();
    });
  }
  function fbPatch(id, patch) {
    return authedFetch(itemPath(id), { method: 'PATCH', body: JSON.stringify(patch) }).then(function (r) {
      if (!r.ok) throw new Error('Save failed (' + r.status + ')');
      return r.json();
    });
  }
  function fbDelete(id) {
    return authedFetch(itemPath(id), { method: 'DELETE' }).then(function (r) {
      if (!r.ok) throw new Error('Delete failed (' + r.status + ')');
      return r.json();
    });
  }
  function fbPutAll(obj) {
    return authedFetch(peoplePath(), { method: 'PUT', body: JSON.stringify(obj) }).then(function (r) {
      if (!r.ok) throw new Error('Save failed (' + r.status + ')');
      return r.json();
    });
  }

  function checkAutoReset() {
    var ids = Object.keys(people);
    if (ids.length > 0 && ids.every(function (id) { return people[id].done; })) {
      ids.forEach(function (id) { people[id].done = false; people[id].excused = false; });
      render();
      showBanner("Everyone's had a turn — new round started!", 3200);
      suppressPollRender = true;
      fbPutAll(people).catch(function (e) { setStatus(e.message, true); })
        .finally(function () { suppressPollRender = false; lastKnownJson = JSON.stringify(people); });
    }
  }

  // ---- Section switching ----
  tabsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-section]');
    if (!btn) return;
    var newSection = btn.getAttribute('data-section');
    if (newSection === currentSection) return;
    currentSection = newSection;
    localStorage.setItem('flagduty-section', currentSection);
    people = {};
    lastKnownJson = null;
    bannerSlot.innerHTML = '';
    updateCopyForSection();
    render();
    setStatus('Loading…');
    loadAndRender();
  });

  // ---- Actions ----
  addForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = addInput.value.trim();
    if (!name) return;
    addBtn.disabled = true;
    setStatus('Adding…');
    fbPost({ name: name, done: false, excused: false, count: 0 }).then(function (res) {
      people[res.name] = { name: name, done: false, excused: false, count: 0 };
      addInput.value = '';
      render();
      setStatus('');
      lastKnownJson = JSON.stringify(people);
    }).catch(function (e) {
      setStatus(e.message, true);
    }).finally(function () {
      addBtn.disabled = false;
    });
  });

  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-action]');
    if (!btn) return;
    var row = btn.closest('.row');
    var id = row.getAttribute('data-id');
    var p = people[id];
    if (!p) return;
    var action = btn.getAttribute('data-action');

    if (action === 'tick') {
      var newDone = !p.done;
      if (!newDone) {
        if (!window.confirm('Mark ' + p.name + ' as not done?')) return;
      }
      p.done = newDone;
      p.excused = false;
      var newCount = Math.max(0, (p.count || 0) + (newDone ? 1 : -1));
      p.count = newCount;
      render();
      fbPatch(id, { done: newDone, excused: false, count: newCount }).then(function () {
        lastKnownJson = JSON.stringify(people);
        checkAutoReset();
      }).catch(function (e) { setStatus(e.message, true); });
    } else if (action === 'excuse') {
      p.done = true;
      p.excused = true;
      render();
      fbPatch(id, { done: true, excused: true }).then(function () {
        lastKnownJson = JSON.stringify(people);
        checkAutoReset();
      }).catch(function (e) { setStatus(e.message, true); });
    } else if (action === 'remove') {
      var name = p.name;
      if (!window.confirm('Remove ' + name + ' from the list?')) return;
      delete people[id];
      render();
      fbDelete(id).then(function () {
        lastKnownJson = JSON.stringify(people);
      }).catch(function (e) {
        setStatus(e.message, true);
      });
    }
  });

  resetBtn.addEventListener('click', function () {
    var ids = Object.keys(people);
    if (ids.length === 0) return;
    if (!window.confirm('Reset flag duty for everyone this round?')) return;
    ids.forEach(function (id) { people[id].done = false; people[id].excused = false; });
    render();
    showBanner('Round reset.', 2400);
    suppressPollRender = true;
    fbPutAll(people).catch(function (e) { setStatus(e.message, true); })
      .finally(function () { suppressPollRender = false; lastKnownJson = JSON.stringify(people); });
  });

  // ---- Load + poll for cross-device sync ----
  function loadAndRender() {
    var sectionAtRequest = currentSection;
    fbGet().then(function (data) {
      if (sectionAtRequest !== currentSection) return; // switched tabs mid-request
      people = data || {};
      var json = JSON.stringify(people);
      if (!suppressPollRender && json !== lastKnownJson) {
        render();
      }
      lastKnownJson = json;
      setStatus('');
    }).catch(function (e) {
      if (sectionAtRequest !== currentSection) return;
      if (e.authFailed) return;
      setStatus('Offline or can\u2019t reach the database — ' + e.message, true);
    });
  }

  updateCopyForSection();
  loadAuth();
  if (auth) startApp(); else showLogin('');

  // ---- PWA service worker ----
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
